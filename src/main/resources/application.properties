# Aplicacion de escritorio: sin servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off

# Base de datos SQLite en la carpeta del usuario (no requiere permisos de administrador)
spring.datasource.url=jdbc:sqlite:${user.home}/.laptop-explorer/laptops.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# Esquema: lo crean y lo cambian las migraciones de db/migration; Hibernate solo comprueba que coincide.
# Una base creada antes de usar migraciones (ya tiene tablas, pero no historial) se toma como version 0
# y recibe todas las migraciones, que por eso toleran encontrar la tabla ya creada.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Registro de actividad: en consola y en un archivo junto a la base de datos (la aplicacion instalada no tiene consola)
logging.level.root=WARN
logging.level.com.laptopexplorer=INFO
logging.file.name=${user.home}/.laptop-explorer/logs/laptop-explorer.log
logging.logback.rollingpolicy.max-file-size=2MB
logging.logback.rollingpolicy.max-history=5
