# Aplicacion de escritorio: sin servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off

# Base de datos SQLite en la carpeta del usuario (no requiere permisos de administrador)
spring.datasource.url=jdbc:sqlite:${user.home}/.laptop-comparator/laptops.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Registro de actividad
logging.level.root=WARN
logging.level.com.laptopstudio=INFO
